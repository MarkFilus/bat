name: tame del pezzo lean public ci

on:
  pull_request:
    paths:
      - ".ci/tame-del-pezzo-lean/**"
      - ".github/workflows/tame-del-pezzo-lean-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tame-del-pezzo-lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: reject enlarged trust base
        shell: bash
        run: |
          set -euo pipefail
          root=.ci/tame-del-pezzo-lean
          if grep -RInE ":=[[:space:]]*(by[[:space:]]+)?(sorry|admit)|by[[:space:]]+(sorry|admit)|^[[:space:]]*axiom[[:space:]]" "$root" --include='*.lean'; then
            echo "forbidden proof placeholder or project axiom" >&2
            exit 1
          fi
          if grep -RIn "native_decide" "$root" --include='*.lean'; then
            echo "native_decide is excluded from the trusted Lean library" >&2
            exit 1
          fi

      - name: install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: update, restore mathlib cache, build, and print axiom ledger
        id: lean-build
        working-directory: .ci/tame-del-pezzo-lean
        shell: bash
        run: |
          set -o pipefail
          {
            lake update
            lake exe cache get
            lake build TameDelPezzo
            lake env lean Audit.lean
          } 2>&1 | tee lean-verification.log
          if grep -E "sorryAx|Lean\.ofReduceBool|Lean\.trustCompiler" lean-verification.log; then
            echo "forbidden axiom found in the audited declarations" >&2
            exit 1
          fi

      - name: independent exact regression computation
        if: steps.lean-build.outcome == 'success'
        working-directory: .ci/tame-del-pezzo-lean
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/regression.py | tee regression.log

      - name: create deterministic source archive and checksums
        if: steps.lean-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          root=.ci/tame-del-pezzo-lean
          archive="$root/tame-del-pezzo-lean-source.tar.gz"
          git ls-files -z "$root" \
            | LC_ALL=C sort -z \
            | tar --null --files-from=- \
                --sort=name \
                --mtime='UTC 2026-07-28 00:00:00' \
                --owner=0 --group=0 --numeric-owner \
                --transform='s#^\.ci/tame-del-pezzo-lean#tame-del-pezzo-lean#' \
                -czf "$archive"
          cd "$root"
          sha256sum \
            lean-toolchain \
            lakefile.lean \
            lake-manifest.json \
            regression-certificate.json \
            tame-del-pezzo-lean-source.tar.gz \
            > artifact-checksums.sha256
          cat artifact-checksums.sha256

      - name: upload primary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tame-del-pezzo-lean-evidence
          path: |
            .ci/tame-del-pezzo-lean/lean-verification.log
            .ci/tame-del-pezzo-lean/regression.log
            .ci/tame-del-pezzo-lean/regression-certificate.json
            .ci/tame-del-pezzo-lean/artifact-checksums.sha256
            .ci/tame-del-pezzo-lean/lake-manifest.json
            .ci/tame-del-pezzo-lean/tame-del-pezzo-lean-source.tar.gz
          if-no-files-found: warn

      - name: check environment with leanchecker
        if: steps.lean-build.outcome == 'success'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .ci/tame-del-pezzo-lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          nanoda: false

      - name: check environment with independent rust checker nanoda
        if: steps.lean-build.outcome == 'success'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .ci/tame-del-pezzo-lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          nanoda: true
          nanoda-allow-sorry: false

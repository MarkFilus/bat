name: tame del pezzo lean public ci

on:
  pull_request:
    paths:
      - ".ci/tame-del-pezzo-lean/**"
      - ".github/workflows/tame-del-pezzo-lean-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tame-del-pezzo-lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: reject proof placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          root=.ci/tame-del-pezzo-lean
          if grep -RInE ":=[[:space:]]*(by[[:space:]]+)?(sorry|admit)|by[[:space:]]+(sorry|admit)|^[[:space:]]*axiom[[:space:]]" "$root" --include='*.lean'; then
            echo "forbidden proof placeholder or project axiom" >&2
            exit 1
          fi

      - name: install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: update, restore mathlib cache, and build lean library
        id: lean-build
        working-directory: .ci/tame-del-pezzo-lean
        shell: bash
        run: |
          set -o pipefail
          {
            lake update
            lake exe cache get
            lake build TameDelPezzo
            lake env lean Audit.lean
          } 2>&1 | tee lean-verification.log

      - name: upload primary verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tame-del-pezzo-lean-verification
          path: .ci/tame-del-pezzo-lean/lean-verification.log
          if-no-files-found: error

      - name: independent environment checkers
        if: steps.lean-build.outcome == 'success'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .ci/tame-del-pezzo-lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false

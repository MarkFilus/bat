name: tame del pezzo lean public ci

on:
  pull_request:
    paths:
      - ".ci/tame-del-pezzo-lean/**"
      - ".github/workflows/tame-del-pezzo-lean-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: reject proof placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          root=.ci/tame-del-pezzo-lean
          if grep -RInE ":=[[:space:]]*(by[[:space:]]+)?(sorry|admit)|by[[:space:]]+(sorry|admit)|^[[:space:]]*axiom[[:space:]]" "$root" --include='*.lean'; then
            exit 1
          fi

      - name: install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .ci/tame-del-pezzo-lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: false
          nanoda: false

      - name: update, cache, and build with captured log
        id: lean-build
        working-directory: .ci/tame-del-pezzo-lean
        shell: bash
        run: |
          set -o pipefail
          {
            lake update
            lake exe cache get
            lake build
          } 2>&1 | tee lean-build.log

      - name: upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tame-del-pezzo-lean-build-log
          path: .ci/tame-del-pezzo-lean/lean-build.log
          if-no-files-found: warn

      - name: independent environment checkers
        if: steps.lean-build.outcome == 'success'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .ci/tame-del-pezzo-lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false

      - name: run finite certificate
        if: steps.lean-build.outcome == 'success'
        working-directory: .ci/tame-del-pezzo-lean
        shell: bash
        run: |
          set -euo pipefail
          lake exe certificate | tee lean-verification.log

      - name: upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tame-del-pezzo-lean-verification
          path: .ci/tame-del-pezzo-lean/lean-verification.log
          if-no-files-found: warn
